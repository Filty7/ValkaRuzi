    if (b === 0) {
      drum(t, 0.2 + inten * 0.15, true);
      // basový tón na začátku taktu
      tone({ type: 'sine', f: BASS[bar] * 2, a: 0.04, d: 3.6, v: 0.07, bus: 'music', rev: 0.3, t: t - ctx.currentTime });
    } else if (b === 2) {
      drum(t, 0.1 + inten * 0.12, false);
    } else if (inten > 0.35 && Math.random() < inten) {
      drum(t, 0.07 + inten * 0.08, false);
    }
    if (inten > 0.6 && (b === 1 || b === 3)) drum(t + BEAT * 0.5, 0.06 + inten * 0.05, true);
    // melodie: řídké drnkané tóny
    if (Math.random() < 0.5) {
      const r = Math.random();
      mus.walk += r < 0.18 ? -2 : r < 0.42 ? -1 : r < 0.55 ? 0 : r < 0.82 ? 1 : 2;
      if (b === 3 && Math.random() < 0.35) mus.walk = Math.random() < 0.5 ? 0 : 4; // kadence k D nebo A
      mus.walk = Math.max(0, Math.min(SCALE.length - 1, mus.walk));
      const off = Math.random() < 0.3 ? BEAT * 0.5 : 0;
      pluck(SCALE[mus.walk] * 0.5, t + off, 0.07 + Math.random() * 0.025, 0.55);
      if (Math.random() < 0.16) pluck(SCALE[Math.max(0, mus.walk - 2)] / 4, t + off, 0.04, 0.6);
    }
    mus.beat++;
    if (mus.beat % 4 === 0) mus.bar++;
    if (mus.droneLP) {
      try { mus.droneLP.frequency.setTargetAtTime(240 + inten * 520, ctx.currentTime, 2); } catch (e) { /* */ }
    }
  }
  function tick() {
    if (!ctx || !mus.running) return;
    while (mus.nextT < ctx.currentTime + 0.9) {
      scheduleBeat(Math.max(mus.nextT, ctx.currentTime + 0.02));
      mus.nextT += BEAT;
    }
  }
  function musicStart() {
    try {
      if (!prefs.music) return;
      if (!init()) return;
      if (mus.running) return;
      mus.running = true;
      musicBus.gain.setTargetAtTime(0.5, ctx.currentTime, 0.4);
      startDrone();
      mus.nextT = ctx.currentTime + 0.4;
      mus.timer = setInterval(tick, 220);
      tick();
    } catch (e) { mus.running = false; }
  }
  function musicStop() {
    try {
      if (!mus.running) return;
      mus.running = false;
      clearInterval(mus.timer); mus.timer = null;
      stopDrone();
    } catch (e) { /* */ }
  }
  function setIntensity(x) { mus.intensity = Math.max(0, Math.min(1, x || 0)); }

  function setSfx(on) { prefs.sfx = !!on; savePrefs(); if (sfxBus) sfxBus.gain.setTargetAtTime(on ? 1 : 0, ctx.currentTime, 0.05); }
  function setMusic(on) {
    prefs.music = !!on; savePrefs();
    if (on) { if (ctx) musicBus.gain.setTargetAtTime(0.5, ctx.currentTime, 0.3); musicStart(); }
    else { if (ctx) musicBus.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.3); musicStop(); }
  }

  document.addEventListener('visibilitychange', () => {
    try {
      if (!ctx) return;
      if (document.hidden) ctx.suspend(); else ctx.resume();
    } catch (e) { /* */ }
  });

  return {
    init, sfx, musicStart, musicStop, setIntensity, setSfx, setMusic, prefs,
    // jen pro testy (offline render)
    _build: build, _SFX: SFX, _music: { startDrone, scheduleBeat, mus },
  };
})();

</script>
<script>
// ===================== TUTORIAL — krok za krokem na ukázkách ze skutečných karet =====================
// Samostatná vrstva (overlay #tutorial) bez vazby na herní engine: každý krok má vlastní malou scénu
// postavenou ze stejných karet/polí/erbů jako hra. Kroky s "úkolem" se dají splnit přetažením karty
// (nebo klikem na kartu a potom na okno) a odemknou tlačítko Další.
const Tutorial = (function () {
  let root = null, idx = 0, onClose = null, doneSet = new Set();
  const PC = { Ty: '#3f9a58', York: '#7a4cc0', Lancaster: '#c23a3a', Neville: '#3b6fd0' };

  // ---------- stavební prvky ----------
  function cardEl(color, value, o) {
    o = o || {};
    const n = h('div', 'card t-card' + (o.cls ? ' ' + o.cls : ''), `<div class="art">${o.back ? Art.cardBack(o.v || 0) : Art.cardFace(color, value, o.v || 0)}</div>`);
    if (o.cw) n.style.setProperty('--cw', o.cw);
    n.dataset.color = color; n.dataset.value = value;
    return n;
  }
  function tileEl(color, tokens, o) {
    o = o || {};
    const n = h('div', 'tile t-tile' + (o.mine ? ' mine' : ''), `<div class="tile-art">${Art.tile(color)}</div><div class="occ">${(tokens || []).map((k) => `<div class="tok${k === 'Ty' ? ' me' : ''}">${Art.shield(k)}</div>`).join('')}</div>`);
    n.style.setProperty('--tw', o.tw || '6rem');
    n.style.animation = 'none';
    return n;
  }
  function sumPlate(v, cls) { return h('div', 't-sum' + (cls ? ' ' + cls : ''), `<span class="lbl">Součet</span><b>${v}</b>`); }
  function setSum(plate, v) { const b = plate.querySelector('b'); if (b.textContent !== String(v)) { b.textContent = v; plate.classList.remove('bump'); void plate.offsetWidth; plate.classList.add('bump'); } }
  function seatBox(name, key, cards, sum, o) {
    o = o || {};
    const box = h('div', 't-seat' + (o.cls ? ' ' + o.cls : ''));
    const head = h('div', 't-seat-head', `<span class="emb" style="--pc:${PC[key] || '#888'}">${Art.shield(key)}</span><span class="nm">${name}</span>`);
    const row = h('div', 't-cards');
    cards.forEach((c) => row.appendChild(c));
    const plate = sumPlate(sum);
    box.append(head, row, plate);
    box._row = row; box._plate = plate;
    return box;
  }
  function note(text, cls) { return h('div', 't-note' + (cls ? ' ' + cls : ''), text); }
  function zone(title, sub, cls) { return h('div', 't-zone' + (cls ? ' ' + cls : ''), `<div class="zt">${title}</div><div class="zs">${sub || ''}</div>`); }

  // ---------- přetahování karty do oken ----------
  // zonesFn() -> pole elementů; onDrop(zoneEl, cardEl) vrací true, když se karta přijala.
  function enableDrag(card, zonesFn, onDrop) {
    let ghost = null, sx = 0, sy = 0, moved = false, over = null;
    const clearOver = () => { zonesFn().forEach((z) => z.classList.remove('hot')); over = null; };
    const hit = (x, y) => zonesFn().find((z) => { const r = z.getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom; }) || null;
    card.addEventListener('pointerdown', (e) => {
      if (card.classList.contains('locked-card')) return;
      e.preventDefault();
      sx = e.clientX; sy = e.clientY; moved = false;
      const r = card.getBoundingClientRect();
      const offx = e.clientX - r.left, offy = e.clientY - r.top;
      const mv = (ev) => {
        if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 6) return;
        if (!moved) {
          moved = true; sfx('pick');
          ghost = card.cloneNode(true); ghost.classList.add('t-ghost'); ghost.style.width = r.width + 'px'; ghost.style.setProperty('--cw', r.width + 'px');
          document.body.appendChild(ghost); card.classList.add('drag-origin');
          zonesFn().forEach((z) => z.classList.add('armed'));
        }
        ghost.style.left = (ev.clientX - offx) + 'px'; ghost.style.top = (ev.clientY - offy) + 'px';
        const z = hit(ev.clientX, ev.clientY);
        if (z !== over) { if (over) over.classList.remove('hot'); over = z; if (z) z.classList.add('hot'); }
      };
      const up = (ev) => {
        window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
        if (!moved) { selectCard(card, zonesFn, onDrop); return; }
        const z = hit(ev.clientX, ev.clientY);
        if (ghost) { ghost.remove(); ghost = null; }
        card.classList.remove('drag-origin'); zonesFn().forEach((q) => q.classList.remove('armed', 'hot'));
        if (z) onDrop(z, card);
      };
      window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
    });
  }
  // klik na kartu = označit, klik na okno = zahrát tam
  let selected = null, selZones = null, selDrop = null;
  function selectCard(card, zonesFn, onDrop) {
    if (selected) selected.classList.remove('selected');
    if (selected === card) { selected = null; zonesFn().forEach((z) => z.classList.remove('armed')); return; }
    selected = card; card.classList.add('selected'); sfx('select');
    selZones = zonesFn; selDrop = onDrop;
    zonesFn().forEach((z) => z.classList.add('armed'));
  }
  function bindZoneClicks(zones) {
    zones.forEach((z) => {
      z.addEventListener('click', () => {
        if (!selected || !selZones || !selZones().includes(z)) return;
        const c = selected; selected.classList.remove('selected'); selected = null;
        selZones().forEach((q) => q.classList.remove('armed'));
        selDrop(z, c);
      });
    });
  }
  function resetSelection() { selected = null; selZones = null; selDrop = null; }

  // ---------- obecné pomůcky kroků ----------
  function ctxFor(step, sceneEl) {
    return {
      scene: sceneEl,
      say(msg, kind) { const fb = root.querySelector('.tut-fb'); fb.className = 'tut-fb ' + (kind || ''); fb.innerHTML = msg; },
      done() { doneSet.add(idx); refreshNav(); const fb = root.querySelector('.tut-fb'); fb.classList.add('ok'); sfx('claim'); },
    };
  }
  function pick(entries, cls, cb) { // režim výběru: klik na jednu z karet
    entries.forEach((e) => { e.classList.add('t-pickable'); e.onclick = () => { entries.forEach((x) => { x.classList.remove('t-pickable'); x.onclick = null; }); cb(e); }; });
  }

  // ---------- kroky ----------
  const STEPS = [
    { // 1
      title: 'Cíl hry',
      text: () => `<p>Dva rody bojují o korunu. Hra se hraje na <b>kola</b>. Kdo kolo vyhraje, získá <b>pole</b>, na kterém stojí.</p>
        <p>Jakmile někdo nasbírá <b>4 pole</b> (ve třech hráčích <b>5 polí</b>), hra končí a sečtou se body. Pole mají barvu a <b>barva znamená schopnost</b>.</p>
        <p class="tut-tip">Je to hra o odhadu soupeřů: kdy zabrat, kdy ustoupit a kdy schovat karty na lepší chvíli.</p>`,
      build(c) {
        const row = h('div', 't-row t-center');
        COLORS.forEach((col) => {
          const w = h('div', 't-col');
          w.append(tileEl(col, [], { tw: '6.4rem' }), h('div', 't-cap', `<b>${COLOR_ABILITY_NAME[col]}</b>`));
          row.appendChild(w);
        });
        c.scene.append(note('Pět barev polí = pět schopností', 'top'), row);
      },
    },
    { // 2
      title: 'Tvůj první tah',
      gate: true,
      text: () => `<p>V kole se střídáte po směru hodinových ručiček. Ve svém tahu <b>zahraješ kartu</b>: její číslo se přičte k tvému <b>součtu</b>.</p>
        <p>Kolo vyhraje ten, kdo má nakonec <b>nejvyšší součet</b>.</p>
        <p class="tut-task">Úkol: přetáhni jednu kartu z ruky na svůj stůl (nebo na ni klikni a pak klikni na stůl).</p>`,
      build(c) {
        const opp = seatBox('York', 'York', [cardEl('B', 4, { cw: '3.7rem' })], 4, { cls: 'opp' });
        const opp2 = seatBox('Lancaster', 'Lancaster', [cardEl('Y', 3, { cw: '3.7rem' }), cardEl('N', 2, { cw: '3.7rem' })], 5, { cls: 'opp' });
        const my = seatBox('Ty', 'Ty', [], 0, { cls: 'me' });
        const drop = zone('Tvůj stůl', 'sem přetáhni kartu', 'table'); my._row.appendChild(drop);
        const hand = h('div', 't-hand');
        const cards = [cardEl('R', 3, { cw: '5rem' }), cardEl('B', 2, { cw: '5rem', v: 1 }), cardEl('N', 5, { cw: '5rem', v: 2 })];
        cards.forEach((cd) => hand.appendChild(cd));
        const top = h('div', 't-row t-between'); top.append(opp, opp2);
        c.scene.append(top, my, hand);
        let played = false;
        const zones = () => [drop];
        cards.forEach((cd) => enableDrag(cd, zones, (z, card) => {
          if (played) return;
          played = true; sfx('card');
          drop.style.display = 'none';
          const placed = cardEl(card.dataset.color, +card.dataset.value, { cw: '4.4rem' });
          my._row.appendChild(placed); card.style.visibility = 'hidden';
          setSum(my._plate, +card.dataset.value);
          c.say(`Zahrána karta: ${COLOR_NAME[card.dataset.color]} ${card.dataset.value}. Tvůj součet je teď <b>${card.dataset.value}</b>.`, 'ok');
          c.done();
        }));
        bindZoneClicks([drop]);
      },
    },
    { // 3
      title: 'Pass a výhra kola',
      gate: true,
      text: () => `<p>Kdykoli můžeš <b>passnout</b>: pro zbytek kola už nehraješ a tvůj součet zůstane, jak je. Kdo passnul, už se nevrací.</p>
        <p>Soupeři York i Lancaster už passnuli. Ty zaostáváš. Přidej karty tak, aby ses dostal do <b>vedení</b>, a pak passni.</p>
        <p class="tut-tip">Při shodě součtu vyhrává ten, kdo je po směru blíž hráči, který kolo začal. Karty nehraj zbytečně: co nepoložíš, zůstane ti na příště.</p>
        <p class="tut-task">Úkol: vyhraj toto kolo.</p>`,
      build(c) {
        const mk = (name, key, cards, sum) => { const s = seatBox(name, key, cards, sum, { cls: 'opp' }); s.append(h('div', 't-passed', 'passnul')); return s; };
        const a = mk('York', 'York', [cardEl('R', 5, { cw: '3.7rem' }), cardEl('B', 3, { cw: '3.7rem' })], 8);
        const b = mk('Lancaster', 'Lancaster', [cardEl('Y', 4, { cw: '3.7rem' }), cardEl('N', 3, { cw: '3.7rem' })], 7);
        const my = seatBox('Ty', 'Ty', [cardEl('G', 4, { cw: '4.4rem' })], 4, { cls: 'me' });
        const drop = zone('Tvůj stůl', 'sem přetáhni kartu', 'table'); my._row.appendChild(drop);
        const hand = h('div', 't-hand');
        const cards = [cardEl('R', 4, { cw: '5rem' }), cardEl('B', 2, { cw: '5rem', v: 1 }), cardEl('N', 3, { cw: '5rem', v: 2 })];
        cards.forEach((cd) => hand.appendChild(cd));
        const pass = h('button', 't-pass', '<span>Pass</span>');
        const top = h('div', 't-row t-between'); top.append(a, b);
        const bottom = h('div', 't-bottom'); bottom.append(hand, pass);
        c.scene.append(top, my, bottom);
        let sum = 4, finished = false;
        const zones = () => [drop];
        cards.forEach((cd) => enableDrag(cd, zones, (z, card) => {
          if (finished) return;
          sfx('card'); const v = +card.dataset.value; sum += v;
          const placed = cardEl(card.dataset.color, v, { cw: '4.4rem' });
          my._row.insertBefore(placed, drop); card.style.visibility = 'hidden'; card.classList.add('locked-card');
          setSum(my._plate, sum);
          c.say(`Tvůj součet je <b>${sum}</b>. Soupeři mají 8 a 7.`, sum > 8 ? 'ok' : '');
        }));
        bindZoneClicks([drop]);
        pass.onclick = () => {
          if (finished) return;
          if (sum > 8) {
            finished = true; sfx('pass'); pass.disabled = true; my.classList.add('winner');
            c.say(`Passuješ se součtem <b>${sum}</b>. Soupeři už nemají jak reagovat, <b>kolo je tvoje</b> a bereš pole, na kterém stojíš.`, 'ok');
            c.done();
          } else {
            sfx('error'); c.say(`Se součtem ${sum} by kolo <b>skončilo prohrou</b> (York má 8). Přidej další kartu a zkus to znovu.`, 'bad');
          }
        };
      },
    },
    { // 3b remíza
      title: 'Remíza',
      gate: true,
      text: () => `<p>Co když mají dva hráči <b>stejný součet</b>? Rozhoduje <b>pořadí u stolu</b>: vyhrává ten, kdo sedí <b>blíž po směru hodinových ručiček za hráčem, který kolo začal</b>. Začínající hráč má v remíze nejlepší pozici.</p>
        <p>Stejné pravidlo platí i při <b>shodě bodů na konci hry</b>.</p>
        <p class="tut-tip">Proto se vyplatí o jeden bod víc, když sedíš „dál“ od začínajícího. A kdo je blízko začínajícímu, může při remíze klidně passnout.</p>
        <p class="tut-task">Úkol: kolo začal Lancaster. Ty a York máte po 9. Klikni na vítěze.</p>`,
      build(c) {
        const mk = (name, key, cards, sum, order, start) => {
          const b = seatBox(name, key, cards, sum, { cls: 'opp' });
          b.append(h('div', 't-order' + (start ? ' start' : ''), start ? `${order}. začíná kolo` : `${order}. v pořadí`));
          return b;
        };
        const lan = mk('Lancaster', 'Lancaster', [cardEl('Y', 4, { cw: '3.7rem' }), cardEl('N', 3, { cw: '3.7rem' })], 7, 1, true);
        const me = mk('Ty', 'Ty', [cardEl('G', 4, { cw: '3.7rem' }), cardEl('R', 5, { cw: '3.7rem' })], 9, 2, false);
        const york = mk('York', 'York', [cardEl('B', 5, { cw: '3.7rem' }), cardEl('S', 4, { cw: '3.7rem' })], 9, 3, false);
        const row = h('div', 't-row t-center t-gap'); row.append(lan, me, york);
        const arrow = h('div', 't-note', 'Pořadí po směru hodinových ručiček od hráče, který kolo začal →');
        c.scene.append(arrow, row);
        let done = false;
        const choose = (box, name) => () => {
          if (done) return;
          if (box === me) {
            done = true; sfx('claim'); me.classList.add('winner');
            c.say('Správně! Oba máte 9, ale <b>Ty sedíš po Lancasterovi dřív</b> než York, takže kolo bereš ty.', 'ok'); c.done();
          } else if (box === york) {
            sfx('error'); c.say('York má sice 9, jenže v pořadí od začínajícího přichází až <b>po tobě</b>. Zkus to znovu.', 'bad');
          } else {
            sfx('error'); c.say('Lancaster má jen 7. Remíza je mezi Tebou a Yorkem.', 'bad');
          }
        };
        [[lan, 'Lancaster'], [me, 'Ty'], [york, 'York']].forEach(([b, n]) => { b.style.cursor = 'pointer'; b.onclick = choose(b, n); });
      },
    },
    { // 4
      title: 'Pole, na kterém stojíš',
      text: () => `<p>Každý hráč <b>stojí na jednom poli</b>. Vítěz kola si pole <b>vezme do svého panství</b> a vybere si nové.</p>
        <p>Na <b>obsazené pole</b> se dá vstoupit, ale stojí to <b>kartu</b> z ruky (nebo 3 karty z vrchu balíčku). Kdo přišel o pole, protože ho vyhrál soupeř, musí se přesunout stejným způsobem.</p>
        <p class="tut-tip">Barva pole, na kterém stojíš, určuje, jakou schopnost můžeš v kole použít. Vybírej pole podle karet na ruce.</p>`,
      build(c) {
        const row = h('div', 't-row t-center');
        const t1 = tileEl('R', ['Ty'], { mine: true, tw: '6.6rem' });
        const t2 = tileEl('B', ['York', 'Lancaster'], { tw: '6.6rem' });
        const t3 = tileEl('G', [], { tw: '6.6rem' });
        [[t1, 'Stojíš tu ty'], [t2, 'Obsazeno — vstup stojí kartu'], [t3, 'Volné pole']].forEach(([t, cap]) => { const w = h('div', 't-col'); w.append(t, h('div', 't-cap', cap)); row.appendChild(w); });
        c.scene.append(note('Kdo vyhraje kolo, bere své pole', 'top'), row);
      },
    },
    { // 5
      title: 'Schopnost zdarma',
      gate: true,
      text: () => `<p>Když zahraješ kartu <b>stejné barvy, jako je pole, na kterém stojíš</b>, spustí se schopnost pole <b>zdarma</b>.</p>
        <p>Stojíš na <b>červeném poli</b>: Vražda zničí jednu soupeřovu vyloženou kartu.</p>
        <p class="tut-task">Úkol: zahraj červenou kartu a znič Yorkovu modrou 5.</p>`,
      build(c) {
        const bl = cardEl('B', 5, { cw: '3.9rem' }), gr = cardEl('G', 2, { cw: '3.9rem' });
        const york = seatBox('York', 'York', [bl, gr], 7, { cls: 'opp' });
        const lan = seatBox('Lancaster', 'Lancaster', [cardEl('Y', 3, { cw: '3.9rem' })], 3, { cls: 'opp' });
        const my = seatBox('Ty', 'Ty', [], 0, { cls: 'me' });
        const drop = zone('Tvůj stůl', 'sem přetáhni kartu', 'table'); my._row.appendChild(drop);
        const standing = h('div', 't-standing'); standing.append(tileEl('R', ['Ty'], { mine: true, tw: '3.6rem' }), h('div', 't-cap', 'Stojíš na červeném<br>Vražda'));
        const hand = h('div', 't-hand');
        const cards = [cardEl('R', 3, { cw: '5rem' }), cardEl('B', 2, { cw: '5rem', v: 1 }), cardEl('N', 4, { cw: '5rem', v: 2 })];
        cards.forEach((cd) => hand.appendChild(cd));
        const top = h('div', 't-row t-between'); top.append(york, lan);
        const mid = h('div', 't-row t-between t-mid'); mid.append(standing, my);
        c.scene.append(top, mid, hand);
        let used = false;
        const zones = () => [drop];
        cards.forEach((cd) => enableDrag(cd, zones, (z, card) => {
          if (used) return;
          const col = card.dataset.color, v = +card.dataset.value;
          if (col !== 'R') { sfx('error'); c.say('Tahle karta barvě pole <b>neodpovídá</b>, schopnost se nespustí. Zkus červenou.', 'bad'); return; }
          used = true; sfx('card');
          const placed = cardEl('R', v, { cw: '4.4rem' }); my._row.insertBefore(placed, drop); drop.style.display = 'none'; card.style.visibility = 'hidden';
          setSum(my._plate, v);

    { // 6
      title: 'Pět schopností',

    { // 8
      title: 'Uschování karty',
      gate: true,
      text: () => `<p>Kartu nemusíš hrát na stůl. Můžeš ji <b>uschovat do truhly</b>: položíš ji <b>lícem dolů</b>. Soupeři nevidí, co to je, a do součtu kola se počítá jako <b>1</b>.</p>

      build(c) {
        const my = seatBox('Ty', 'Ty', [], 0, { cls: 'me' });
        const drop = zone('Tvůj stůl', 'zahrát lícem nahoru', 'table'); my._row.appendChild(drop);

          used = true; sfx('bank');

      text: () => `<p>Jednička je zvláštní: když ji zahraješ, musíš si <b>jednu svou vyloženou kartu (2 a víc) vzít zpět na ruku</b>.</p>

      build(c) {

        const my = seatBox('Ty', 'Ty', [a, b], 8, { cls: 'me' });

      text: () => `<p>Na začátku hry dostaneš <b>tajného hrdinu</b>. Soupeři vidí jen to, že nějakého mají. Hrdinu můžeš <b>jednou za hru</b> vyložit jako svůj tah (od 2. kola, přetažením do okna <b>Vyložit hrdinu</b>).</p>

        <p>Potom se sečtou body (<b>pole × (1 + karty v truhle)</b>) a vyhrává ten, kdo jich má nejvíc.</p>`,
      build(c) {
        const list = h('div', 't-steps');
        [['1', 'Vítěz kola bere pole, na kterém stál.'], ['2', 'Karty v truhle všech jdou do jejich panství.'], ['3', 'Vítěz si vybere nové pole; vytlačení hráči se přesunou.'], ['4', 'Všichni dobírají 2 karty (max. 10 na ruce).'], ['5', 'Vítěz začíná další kolo.']].forEach(([n, t]) => list.appendChild(h('div', 't-st', `<span class="n">${n}</span><span>${t}</span>`)));
        c.scene.append(note('Jedno kolo od začátku do konce', 'top'), list);

      last: true,
      text: () => `<p>Teď už znáš všechna pravidla. Poslední rady:</p>
        <ul><li>Nehoň každé kolo za každou cenu. <b>Passni včas</b> a ušetři karty.</li>
        <li>Karty barev, které <b>sbíráš</b>, raději <b>uschovej do truhly</b>.</li>
        <li>Sleduj, kolik karet mají soupeři a kdo už passnul.</li></ul>
        <p class="tut-tip">Kdykoli si můžeš pravidla připomenout v horní liště (ikona knihy).</p>`,
      build(c) {
        const row = h('div', 't-row t-center');
        const w = h('div', 't-col');
        w.append(h('div', 't-crown', Art.crownIcon()), h('div', 't-cap big', 'Hodně štěstí u stolu'));
        row.appendChild(w); c.scene.append(row);
      },
    },
  ];

  // ---------- vykreslení ----------
  function refreshNav() {
    const st = STEPS[idx];
    const next = root.querySelector('.t-next'), prev = root.querySelector('.t-prev');
    prev.disabled = idx === 0;
    const locked = st.gate && !doneSet.has(idx);
    next.disabled = locked;
    next.textContent = st.last ? 'Zahrát si' : 'Další';
    root.querySelector('.t-skip-step').style.display = locked ? '' : 'none';
    root.querySelectorAll('.t-dot').forEach((d, i) => { d.classList.toggle('on', i === idx); d.classList.toggle('done', i < idx || doneSet.has(i)); });
  }
  function show(i) {
    resetSelection();
    idx = Math.max(0, Math.min(STEPS.length - 1, i));
    const st = STEPS[idx];
    root.querySelector('.tut-title').textContent = st.title;
    root.querySelector('.tut-n').textContent = `Krok ${idx + 1} / ${STEPS.length}`;
    root.querySelector('.tut-body').innerHTML = st.text();
    const fb = root.querySelector('.tut-fb'); fb.className = 'tut-fb'; fb.innerHTML = '';
    const scene = root.querySelector('.tut-scene'); scene.innerHTML = ''; scene.className = 'tut-scene';
    st.build(ctxFor(st, scene));
    scene.scrollTop = 0;
    refreshNav();
  }
  function close(finished) {
    root.classList.add('hidden'); resetSelection();
    const cb = onClose; onClose = null;
    try { localStorage.setItem('vr_tutorial_done', '1'); } catch (e) { /* */ }
    if (cb) cb(!!finished);
  }
  function open(cb, startAt) {
    root = $('tutorial'); onClose = cb || null; doneSet = new Set();
    if (!root._built) {
      root._built = true;
      root.innerHTML = `<div class="tut">
        <div class="tut-text">
          <button class="x t-close" aria-label="Zavřít">×</button>
          <div class="tut-n"></div>
          <h2 class="tut-title"></h2>
          <div class="divider">${Art.DIVIDER}</div>
          <div class="tut-body"></div>
          <div class="tut-fb"></div>
          <div class="tut-nav">
            <button class="btn t-prev">Zpět</button>
            <button class="btn primary t-next">Další</button>
          </div>
          <button class="t-skip-step" style="display:none">Přeskočit tento úkol</button>
          <div class="tut-dots">${STEPS.map((_, i) => `<span class="t-dot" data-i="${i}"></span>`).join('')}</div>
        </div>
        <div class="tut-scene"></div>
      </div>`;
      root.querySelector('.t-close').onclick = () => { sfx('select'); close(false); };
      root.querySelector('.t-prev').onclick = () => { sfx('pick'); show(idx - 1); };
      root.querySelector('.t-next').onclick = () => { sfx('pick'); if (STEPS[idx].last) close(true); else show(idx + 1); };
      root.querySelector('.t-skip-step').onclick = () => { doneSet.add(idx); sfx('pick'); show(idx + 1); };
      root.querySelectorAll('.t-dot').forEach((d) => { d.onclick = () => { const i = +d.dataset.i; if (i <= idx || doneSet.has(i - 1) || !STEPS.slice(0, i).some((s, k) => s.gate && !doneSet.has(k))) show(i); }; });
    }
    root.classList.remove('hidden');
    show(startAt || 0);
  }
  return { open, STEPS };
})();

</script>
<script>
// ===================== UI VRSTVA — STOLNÍ VZHLED =====================
// Pohled hráče u stolu. Engine (game.js) volá globální funkce uiLog/uiRender/uiHuman*; tady je
// implementujeme nad DOM ze template.html. Karty/pole/hrdinové jsou SVG z art.js, zvuk ze Sound (audio.js).

const $ = (id) => document.getElementById(id);
const UI = {
  game: null, tempo: 'normal', seatsFor: null,
  selected: null,       // { kind:'card'|'hero', id }
  drag: null,           // probíhající tažení
  actionResolve: null,  // resolve čekající uiHumanChooseAction
  pick: null,           // { kind, ids:Set, resolve }
  passArmed: false, passTimer: null,
  lastFlash: new Map(), seenRender: false,
  gestured: false,
};

// ---------- pomocné ----------
function h(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function setHTML(node, html) { if (node._h !== html) { node.innerHTML = html; node._h = html; } }
function remPx() { return parseFloat(getComputedStyle(document.documentElement).fontSize) || 16; }
function hashStr(s) { let x = 0; for (let i = 0; i < s.length; i++) x = (x * 31 + s.charCodeAt(i)) >>> 0; return x; }
function variantOf(id) { return hashStr(String(id)) % 4; }
function stageRect() { return $('stage').getBoundingClientRect(); }
function relCenter(node) {
  const s = stageRect(), r = node.getBoundingClientRect();
  return { x: r.left - s.left + r.width / 2, y: r.top - s.top + r.height / 2, w: r.width, h: r.height };
}
function sfx(name) { try { Sound.sfx(name); } catch (e) { /* */ } }
function fastMode() { return TURN_STEP_MS === 0; }
function delay(ms) { return ms > 0 ? new Promise((r) => setTimeout(r, ms)) : Promise.resolve(); }
const shieldKey = (p) => (p.isHuman ? 'Ty' : p.name);
const humanOf = (game) => game.players.find((p) => p.isHuman);

function reconcile(container, items, keyOf, make, sigOf, update) {
  const existing = new Map();
  for (const ch of Array.from(container.children)) if (ch._key != null) existing.set(ch._key, ch);
  const used = new Set();
  let prev = null;
  for (const it of items) {
    const k = keyOf(it);
    let node = existing.get(k);
    const sig = sigOf(it);
    if (!node) { node = make(it); node._key = k; node._sig = sig; node._isNew = true; }
    else if (node._sig !== sig) { const old = node._sig; node._sig = sig; update(node, it, old); }
    used.add(k);
    const ref = prev ? prev.nextSibling : container.firstChild;
    if (node !== ref) container.insertBefore(node, ref);
    prev = node;
  }
  for (const [k, node] of existing) if (!used.has(k)) node.remove();
}

// ---------- tempo ----------
const TEMPOS = {
  slow:    { label: 'Pomalé',   bot: 900, place: 450, round: 900, step: 1300 },
  normal:  { label: 'Běžné',    bot: 650, place: 300, round: 600, step: 950 },
  fast:    { label: 'Rychlé',   bot: 260, place: 140, round: 260, step: 420 },
  instant: { label: 'Okamžité', bot: 0,   place: 0,   round: 0,   step: 0 },
};
function applyTempo(key) {
  const t = TEMPOS[key] || TEMPOS.normal;
  UI.tempo = TEMPOS[key] ? key : 'normal';
  BOT_DELAY_MS = t.bot; PLACEMENT_DELAY_MS = t.place; ROUNDEND_DELAY_MS = t.round; TURN_STEP_MS = t.step;
  const b = $('btn-speed'); if (b) b.setAttribute('data-tip', 'Tempo hry|Teď: ' + t.label + ' (klikni pro změnu)');
}

// ---------- tooltip ----------
function showTip(target) {
  const raw = target.getAttribute('data-tip'); if (!raw) return;
  const tip = $('tooltip');
  const [title, ...rest] = raw.split('|');
  tip.innerHTML = '';
  const b = h('b'); b.textContent = title; tip.appendChild(b);
  if (rest.length) { const d = h('div', 'tt-sub'); d.textContent = rest.join('|'); tip.appendChild(d); }
  tip.classList.remove('hidden');
  const s = stageRect(), r = target.getBoundingClientRect(), tr = tip.getBoundingClientRect();
  let x = r.left - s.left + r.width / 2 - tr.width / 2;
  let y = r.top - s.top - tr.height - 8;
  if (y < 4) y = r.bottom - s.top + 8;
  x = Math.max(4, Math.min(s.width - tr.width - 4, x));
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function hideTip() { $('tooltip').classList.add('hidden'); }

// ---------- efekty ----------
function toast(text) {
  const t = h('div', 'toast'); t.textContent = text;
  $('toasts').appendChild(t);
  setTimeout(() => t.remove(), 3300);
}
function burst(x, y, color, n, spread) {
  if (fastMode()) return;
  const layer = $('fx-layer'); const r = remPx();
  n = n || 14; spread = (spread || 3.2) * r;
  for (let i = 0; i < n; i++) {
    const d = h('div', 'particle');
    const sz = (0.25 + Math.random() * 0.4) * r;

// --- vyložené karty ---

  if (!e.active) bits.push('zničená — nepočítá se');
    if (e.untargetable) bits.push('zamčená úplatkem');
  if (e.favorUsed) bits.push('použit žeton přízně');
  if (e.originalValue != null && e.value !== e.originalValue) bits.push(`původně ${e.originalValue}`);

}
function entryFace(e, owner) {

function entryClasses(e, owner) {

function entrySig(e, owner) {

function layoutPlayed(box) {

function renderPlayed(box, game, p) {

// --- ruka ---
function sortedHand(me) { return [...me.hand].sort((a, b) => (a.color === b.color ? a.value - b.value : a.color.localeCompare(b.color))); }

  const total = step * (n - 1) + cw; const x0 = Math.max(0, (W - total) / 2);

    (c) => {
      const node = h('div', 'card hand-card', `<div class="art">${Art.cardFace(c.color, c.value, variantOf(c.id))}</div>`);
      node.dataset.cid = c.id;

      node.addEventListener('pointerdown', (ev) => onHandPointerDown(ev, 'card', c.id, node));
      node.setAttribute('data-tip', `${COLOR_NAME[c.color]} ${c.value}|${c.color === 'N' ? 'Bezbarvá karta — bez schopnosti pole.' : 'Při zahrání na pole stejné barvy spustí ' + COLOR_ABILITY_NAME[c.color] + '.'}`);

    (c) => c.id,

  Array.from(box.children).forEach((node, i) => {

const ZONE_DEFAULT = {

};
function setZoneTexts(info) {

function zoneInfoFor(game, me, item) {

  else if (tc && c.color === tc && !dis) info.play = { ok: true, good: true, text: `Spustí schopnost: ${COLOR_ABILITY_NAME[tc]}` };
  else info.play = { ok: true, text: dis ? 'Příměří — schopnosti nefungují' : 'Bez schopnosti pole' };
  if (game.heroFlags && game.heroFlags.noBanking) info.bank = { ok: false, text: 'Uschovávání do truhly je teď zakázané' };
  else info.bank = { ok: true, text: c.value ? 'Tajně do panství' : 'Tajný blaf do panství' };
  if (!tc) info.token = { ok: false, text: 'Nestojíš na žádném poli' };
  else if (me.favorTokens <= 0) info.token = { ok: false, text: 'Nemáš žádný žeton přízně' };
  else if (dis) info.token = { ok: false, text: 'Příměří — schopnost propadne' };
  else if (banned) info.token = { ok: false, text: 'Tuhle kartu nelze zahrát' };
  else if (c.color === tc) info.token = { ok: false, text: 'Schopnost proběhne i zdarma' };
  else info.token = { ok: true, good: true, text: `Spustí ${COLOR_ABILITY_NAME[tc]} (žetonů: ${me.favorTokens})` };
  return info;
}
function armZones(item) {

// ---------- vstup: výběr, tažení, pass ----------
function onHandPointerDown(ev, kind, id, node) {
  const game = UI.game;
  if (ev.button != null && ev.button !== 0) return;
  if (UI.pick && UI.pick.kind === 'hand' && kind === 'card') return; // klik řeší onStageClick
  if (!game || !game.__awaitingHumanAction) return;
  if (kind === 'hero') { const me = humanOf(game); const rec = me.heroes.find((x) => x.id === id); if (!rec || rec.used) return; }
  ev.preventDefault();
  const rect = node.getBoundingClientRect();
  UI.drag = { kind, id, node, startX: ev.clientX, startY: ev.clientY, offX: ev.clientX - rect.left, offY: ev.clientY - rect.top, moved: false, ghost: null, over: null, pid: ev.pointerId };
  document.addEventListener('pointermove', onDragMove);
  document.addEventListener('pointerup', onDragEnd);
  document.addEventListener('pointercancel', onDragCancel);
}
function onDragMove(ev) {
  const d = UI.drag; if (!d) return;
  const dx = ev.clientX - d.startX, dy = ev.clientY - d.startY;
  if (!d.moved && Math.hypot(dx, dy) > 7) {
    d.moved = true;
    const s = stageRect(); const r = d.node.getBoundingClientRect();
    const g = h('div', 'ghost card', d.node.querySelector('.art').outerHTML);
    g.style.width = r.width + 'px'; g.style.height = r.height + 'px';
    g.style.filter = 'drop-shadow(0 .6rem .8rem rgba(0,0,0,.7))';
    $('drag-layer').appendChild(g); d.ghost = g;
    d.stageX = s.left; d.stageY = s.top;
    UI.selected = { kind: d.kind, id: d.id };
    armZones(UI.selected);
    UI.dropInfo = zoneInfoFor(UI.game, humanOf(UI.game), UI.selected);
    setDragHint(null);
    sfx('pick');
    d.node.classList.add('drag-origin');
  }
  if (d.moved) {
    d.ghost.style.left = (ev.clientX - d.offX - d.stageX) + 'px';
    d.ghost.style.top = (ev.clientY - d.offY - d.stageY) + 'px';
    d.ghost.style.transform = 'rotate(' + Math.max(-12, Math.min(12, dx / 14)) + 'deg) scale(1.08)';
    const z = dropTargetAt(ev.clientX, ev.clientY);
    if (z !== d.over) {
      d.over = z;
      document.querySelectorAll('.zone').forEach((n) => n.classList.toggle('over', n === z));
      const onBoard = z === $('board');
      $('board').classList.toggle('drop-hot', onBoard && !(UI.dropInfo && UI.dropInfo.play && !UI.dropInfo.play.ok));
      if (z && !z.classList.contains('disabled')) sfx('slide');
      setDragHint(z);
    }
  }
}
function setDragHint(z) {
  const info = UI.dropInfo; if (!info) return;
  const key = z ? (z === $('board') ? (UI.selected && UI.selected.kind === 'hero' ? 'hero' : 'play') : z.dataset.zone) : null;
  const i = key && info[key];
  const base = UI.selected && UI.selected.kind === 'hero' ? 'Pusť hrdinu kamkoliv na stůl.' : 'Pusť kamkoliv na stůl = zahrát · vpravo dole: žeton / uschovat do truhly.';
  $('board-hint').textContent = i ? ({ play: 'Zahrát: ', token: 'Se žetonem: ', bank: 'Uschovat do truhly: ', hero: 'Hrdina: ' }[key] + i.text) : base;
}
function dropTargetAt(x, y) {
  const z = zoneAt(x, y);
  if (z) return z;
  for (const id of ['board', 'my-played']) {
    const r = $(id).getBoundingClientRect();
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return $('board');
  }
  return null;
}
function zoneAt(x, y) {
  const pad = 6;
  for (const z of document.querySelectorAll('.zone')) {
    if (z.offsetParent === null) continue;
    const r = z.getBoundingClientRect();
    if (x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad) return z;
  }
  return null;
}
function endDragListeners() {
  document.removeEventListener('pointermove', onDragMove);
  document.removeEventListener('pointerup', onDragEnd);
  document.removeEventListener('pointercancel', onDragCancel);
}
function onDragEnd(ev) {
  const d = UI.drag; endDragListeners(); if (!d) return;
  UI.drag = null;
  if (d.ghost) d.ghost.remove();
  d.node.classList.remove('drag-origin');
  if (!d.moved) {
    // prosté klepnutí = výběr / zrušení výběru
    const same = UI.selected && UI.selected.kind === d.kind && UI.selected.id === d.id;
    UI.selected = same ? null : { kind: d.kind, id: d.id };
    sfx(same ? 'slide' : 'select');
    armZones(UI.selected);
    uiRender(UI.game);
    return;
  }
  $('board').classList.remove('drop-hot');
  const z = dropTargetAt(ev.clientX, ev.clientY);
  if (z) commitZone(z, true);
  else { UI.selected = null; armZones(null); uiRender(UI.game); }
}
function onDragCancel() {
  const d = UI.drag; endDragListeners(); if (!d) return;
  UI.drag = null; if (d.ghost) d.ghost.remove();
  UI.selected = null; armZones(null); uiRender(UI.game);
}
function commitZone(z, fromDrag) {
  const game = UI.game; const me = humanOf(game);
  const sel = UI.selected;
  if (!sel || !UI.actionResolve) return;
  const isBoard = z === $('board');
  const key = isBoard ? (sel.kind === 'hero' ? 'hero' : 'play') : z.dataset.zone;
  const info = zoneInfoFor(game, me, sel);
  const i = info && info[key];
  if (!i || !i.ok) {
    sfx('error');
    if (isBoard) { if (i) toast(i.text); }
    else { z.classList.remove('shake'); void z.offsetWidth; z.classList.add('shake'); setTimeout(() => z.classList.remove('shake'), 450); }
    if (fromDrag) { UI.selected = null; armZones(null); uiRender(game); }
    return;
  }
  let action;
  if (sel.kind === 'hero') action = { type: 'hero', heroId: sel.id };
  else if (key === 'bank') action = { type: 'bank', cardId: sel.id };
  else if (key === 'token') action = { type: 'play', cardId: sel.id, useToken: true };
  else action = { type: 'play', cardId: sel.id, useToken: false };
  if (!isBoard) { const c = relCenter(z); burst(c.x, c.y, key === 'bank' ? '#cfc6ac' : '#e8cf86', 12, 2.6); }
  finishAction(action);
}
function finishAction(action) {
  const game = UI.game; const res = UI.actionResolve;
  UI.actionResolve = null; UI.selected = null;
  game.__awaitingHumanAction = false;
  resetPass(); armZones(null);
  uiRender(game);
  if (res) res(action);
}
function onPassClick() {
  if (!UI.actionResolve) return;
  const b = $('btn-pass');
  if (!UI.passArmed) {
    UI.passArmed = true; b.classList.add('confirm'); b.querySelector('.seal-text').textContent = 'Jistě?';

function resetPass() {

}
function onStageClick(ev) {
  // klepnutí na okno s vybranou kartou
  if (!UI.pick && UI.selected && UI.actionResolve && !UI.drag) {
    const z = ev.target.closest && ev.target.closest('.zone');
    if (z) { commitZone(z, false); return; }

  }

const ABILITY_SFX = { R: 'dagger', G: 'whisper', Y: 'bribe', B: 'chime', S: 'bell' };
(function wrapEngine() {
  const _trigger = triggerAbility;

        title: COLOR_ABILITY_NAME[color], sub: color === 'G' ? 'Soupeř musí uschovat do truhly kartu z ruky' : COLOR_ABILITY_DESC[color].split('.')[0], ms: Math.max(600, TURN_STEP_MS * 0.85),

  const _playHero = playHero;
  playHero = async function (game, player, heroId) {

      sfx('hero');

        cls: 'hero-reveal', ms: Math.max(1500, TURN_STEP_MS * 2.1),

      });
    }
    return _playHero(game, player, heroId);

  const _playRound = playRound;

      const st = game.players[game.startingPlayerIdx];
      sfx('round');

    }

  };

  const _takeTurn = takeTurn;
  takeTurn = async function (game, player, isFirstRound) {
    game.__currentTurnPlayerId = player.id;

        sfx(w.isHuman ? 'victory' : 'round');
        await showBanner({
          cls: 'win', kicker: 'Konec kola ' + game.round, title: (w.isHuman ? 'Kolo vyhrávaš ty' : 'Kolo vyhrává ' + w.name),
          sub: game.heroFlags && game.heroFlags.invertedWinner ? 'Kingmaker: vyhrává nejnižší součet' : '', extra: `<div class="sums">${sums}</div>`, ms: Math.max(1600, TURN_STEP_MS * 2.4),
        });

  const g = UI.game; const win = g ? g.winTiles : 4;
  let s = `<h2>Jak se hraje</h2><div class="divider">${Art.DIVIDER}</div>
  <p class="lead">Získej ${win} pole dřív než ostatní. Kolo vyhrává ten, kdo má na stole nejvyšší součet. Vítěz bere pole, na kterém stojí.</p>
  <div class="rules-grid">`;
  for (const c of COLORS) s += `<div class="rule-card"><div class="tile-art">${Art.tile(c)}</div><div>${COLOR_ABILITY_DESC[c]}</div></div>`;
  s += `</div><p class="lead">Kartu stejné barvy, jako je pole, na kterém stojíš, zahraješ se schopností zdarma. Jinou kartu můžeš zahrát <b>se žetonem přízně</b> (máš 3 na celou hru), <b>uschovat do truhly</b> lícem dolů (tajně se jí počítá hodnota 1 a po kole putuje do panství), nebo prostě <b>zahrát</b> bez schopnosti.</p>
  <h2>Hrdinové</h2><div class="divider">${Art.DIVIDER}</div><div class="hero-grid">`;
  for (const hd of HERO_LIST) s += `<div class="hero-row"><div class="hc">${Art.hero(hd.id)}</div><div><b>${hd.name}</b><br>${hd.desc}</div></div>`;
  s += '</div><div class="btn-row"><button class="btn btn-tutorial" id="btn-open-tut">Spustit tutoriál</button></div>';
  $('rules-body').innerHTML = s;
  const bt = $('btn-open-tut'); if (bt) bt.onclick = () => { sfx('pick'); Tutorial.open(); };
}
function renderPool() {
  const g = UI.game; const me = humanOf(g);
  let cols = '';
  for (const c of COLORS) {
    const n = me.tilesPool[c], b = me.bankedPool[c];
    const cards = Array.from({ length: Math.min(b, 8) }, (_, i) => `<div class="card">${Art.cardBack(i)}</div>`).join('');
    cols += `<div class="pool-col"><div class="pc-tile">${Art.tile(c)}<span class="cnt">${n}</span></div>
      <div class="pool-banked">${cards}</div><div class="mult">${n} × (1 + ${b})</div><div class="pts">${n * (1 + b)}</div></div>`;
  }
  $('pool-body').innerHTML = `<h2>Tvé panství</h2><div class="divider">${Art.DIVIDER}</div>
    <p class="lead">Získaná pole a karty v truhle vidíš jen ty. Skóre barvy = pole × (1 + karty v truhle té barvy).</p>
    <div class="pool-grid">${cols}</div><div class="pool-total">Celkem: ${finalScore(me)}</div>
    <div class="pool-note">Soupeři ti do panství nevidí — a ty jim také ne.</div>`;
}

// ---------- konec hry ----------
async function uiAnnounceGameEnd(game, scores) {
  const me = humanOf(game);
  const winner = scores[0].player;
  const iWon = winner === me;
  sfx(iWon ? 'victory' : 'defeat');
  if (iWon) { try { burstConfetti(); } catch (e) { /* */ } }
  let rows = '';
  scores.forEach((s, i) => {
    rows += `<tr class="${i === 0 ? 'win' : ''}"><td class="pn">${s.player.isHuman ? 'Ty' : s.player.name}</td>` +
      COLORS.map((c) => { const b = s.breakdown.find((x) => x.color === c); return `<td>${b.tiles}×(1+${b.banked})<br><b>${b.points}</b></td>`; }).join('') +
      `<td class="tot">${s.total}</td></tr>`;
  });
  $('gameover-body').innerHTML = `<div class="setup-rose">${Art.crownIcon()}</div>
    <h2 class="winner-title">${iWon ? 'Vítězíš — koruna je tvá!' : 'Vítězí ' + winner.name}</h2>
    <div class="divider">${Art.DIVIDER}</div>
    <p class="lead">Konečné skóre = pole (barva) × (1 + karty v truhle té barvy), sečteno přes všechny barvy.</p>
    <table class="score-table"><tr><th>Hráč</th>${COLORS.map((c) => `<th>${COLOR_NAME[c]}</th>`).join('')}<th>Celkem</th></tr>${rows}</table>
    <div class="btn-row"><button class="btn primary" id="btn-again">Nová hra</button></div>`;
  $('gameover').classList.remove('hidden');
  $('btn-again').onclick = () => location.reload();
  if (window.__VR_CONFIG) { window.__gameOver = true; return; }
  await new Promise(() => {}); // hra skončila
}
function burstConfetti() {
  const s = stageRect();
  for (let k = 0; k < 6; k++) setTimeout(() => burst(s.width * (0.15 + Math.random() * 0.7), s.height * 0.35, ['#e8cf86', '#b02a2a', '#f6f1e4'][k % 3], 30, 9), k * 240);
}

// ---------- úvodní nastavení ----------
function showSetup() {
  return new Promise((resolve) => {
    const cfg = { players: 4, heroes: 1, diff: 100, tempo: 'normal' };
    const body = $('setup-body');
    const seg = (key, title, opts) => `<div class="opt-group"><div class="opt-title">${title}</div><div class="seg" data-key="${key}">${
      opts.map((o) => `<button data-v="${o[0]}" class="${cfg[key] === o[0] ? 'on' : ''}">${o[1]}<small>${o[2] || ''}</small></button>`).join('')}</div></div>`;
    body.innerHTML = `
      <div class="setup-rose">${Art.svg('0 0 24 24', Art.rose(12, 12, 11, '#f6f1e4', '#b02a2a', Art.GOLD), 'big')}</div>
      <div class="setup-title"><div class="big">Válka růží</div><div class="sub">Anglie, 1455 — dva rody, jedna koruna</div></div>
      <div class="divider">${Art.DIVIDER}</div>
      ${seg('players', 'Počet hráčů', [[4, '4 hráči', 'ty + 3 soupeři · 4 pole'], [3, '3 hráči', 'ty + 2 soupeři · 5 polí']])}
      ${seg('heroes', 'Hrdinové na hráče', [[1, '1', 'výchozí'], [2, '2', ''], [0, 'Bez', '']])}
      ${seg('diff', 'Síla soupeřů', [[100, '100 %', 'plná'], [90, '90 %', ''], [80, '80 %', ''], [70, '70 %', ''], [60, '60 %', ''], [50, '50 %', '']])}
      ${seg('tempo', 'Tempo hry', [['slow', 'Pomalé', ''], ['normal', 'Běžné', ''], ['fast', 'Rychlé', '']])}
      <div class="btn-row"><button class="btn" id="btn-tutorial">Naučit se hrát (tutoriál)</button><button class="btn primary" id="btn-start">Usednout ke stolu</button></div>`;
    body.querySelectorAll('.seg').forEach((sg) => {
      sg.querySelectorAll('button').forEach((b) => {
        b.onclick = () => {
          const raw = b.dataset.v; const key = sg.dataset.key;
          cfg[key] = isNaN(Number(raw)) ? raw : Number(raw);
          sg.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
          sfx('select');
        };
      });
    });
    $('setup').classList.remove('hidden');
    $('btn-tutorial').onclick = () => { sfx('pick'); Sound.init(); Tutorial.open(); };
    $('btn-start').onclick = () => { sfx('pick'); $('setup').classList.add('hidden'); resolve(cfg); };
  });
}

// ---------- start ----------
async function boot() {
  initChrome();
  const cfg = window.__VR_CONFIG || await showSetup();
  applyTempo(cfg.tempo);
  const game = await initGame('Ty', cfg.players, cfg.heroes, cfg.diff);
  window.__game = game; UI.game = game;
  uiRender(game);
  try {
    await runGame(game);
  } catch (err) {
    game.__lastError = err;
    uiLog('Chyba ve hře: ' + (err && err.message ? err.message : String(err)), 'eliminated');
    console.error(err);
  }
}

</script>
<script>
  boot();
</script>

</body></html>
